previews:
  generation: off

services:
  - type: web
    name: hayasend-api
    runtime: image
    plan: starter
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 120
    image:
      url: ghcr.io/haya-inc/hayasend@sha256:458e9299ddef7a0d398e51cc18ce0daae2557cd444af55dadc67ae3e10bea519
    dockerCommand: node dist/server.js
    preDeployCommand: node dist/portable/migrate.js
    envVars:
      - key: HAYASEND_MODE
        value: portable
      - key: HAYASEND_HOST
        value: 0.0.0.0
      - key: HAYASEND_PORT
        value: "10000"
      - key: HAYASEND_DATABASE_URL
        fromDatabase:
          name: hayasend-postgres
          property: connectionString
      - key: HAYASEND_API_KEY
        sync: false
      - key: HAYASEND_TRANSPORT
        value: sendgrid
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: HAYASEND_OBJECT_STORAGE
        value: disabled
      - key: HAYASEND_POSTGRES_POOL_MAX
        value: "8"

  - type: worker
    name: hayasend-worker
    runtime: image
    plan: starter
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 120
    image:
      url: ghcr.io/haya-inc/hayasend@sha256:458e9299ddef7a0d398e51cc18ce0daae2557cd444af55dadc67ae3e10bea519
    dockerCommand: node dist/portable/worker.js
    preDeployCommand: node dist/portable/migrate.js
    envVars:
      - key: HAYASEND_MODE
        value: portable
      - key: HAYASEND_DATABASE_URL
        fromDatabase:
          name: hayasend-postgres
          property: connectionString
      - key: HAYASEND_API_KEY
        fromService:
          name: hayasend-api
          type: web
          envVarKey: HAYASEND_API_KEY
      - key: HAYASEND_TRANSPORT
        value: sendgrid
      - key: SENDGRID_API_KEY
        fromService:
          name: hayasend-api
          type: web
          envVarKey: SENDGRID_API_KEY
      - key: HAYASEND_OBJECT_STORAGE
        value: disabled
      - key: HAYASEND_POSTGRES_POOL_MAX
        value: "8"
      - key: HAYASEND_WORKER_CONCURRENCY
        value: "4"

databases:
  - name: hayasend-postgres
    databaseName: hayasend
    user: hayasend
    postgresMajorVersion: "18"
    plan: basic-256mb
    region: singapore
    ipAllowList: []
    storageAutoscalingEnabled: true
