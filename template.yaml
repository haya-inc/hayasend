AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HayaSend - Resend-compatible email API on Amazon SES

Parameters:
  BootstrapSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$"
    Description: Optional ARN of an existing Secrets Manager secret containing a 32+ character bootstrap key.

Conditions:
  CreateBootstrapSecret: !Equals [!Ref BootstrapSecretArn, ""]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        HAYASEND_MODE: aws
        HAYASEND_API_KEY_SECRET_ARN: !If
          - CreateBootstrapSecret
          - !Ref BootstrapSecret
          - !Ref BootstrapSecretArn
        HAYASEND_TABLE_NAME: !Ref DataTable
        HAYASEND_QUEUE_URL: !Ref JobQueue
        HAYASEND_QUEUE_ARN: !GetAtt JobQueue.Arn
        HAYASEND_PAYLOAD_BUCKET: !Ref PayloadBucket
        HAYASEND_CONFIGURATION_SET: !Ref ConfigurationSet
        HAYASEND_SCHEDULER_GROUP_NAME: !Ref EmailScheduleGroup
        HAYASEND_SCHEDULER_ROLE_ARN: !GetAtt SchedulerTargetRole.Arn
        HAYASEND_SCHEDULER_DLQ_ARN: !GetAtt SchedulerDeadLetterQueue.Arn
        NODE_OPTIONS: --enable-source-maps

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageVariables:
        environment: production
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/aws/api.ts
        Format: esm
        Minify: true
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Target: es2022
    Properties:
      CodeUri: .
      Handler: src/aws/api.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobQueue.QueueName
        - S3CrudPolicy:
            BucketName: !Ref PayloadBucket
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - CreateBootstrapSecret
                - !Ref BootstrapSecret
                - !Ref BootstrapSecretArn
            - Effect: Allow
              Action:
                - ses:CreateEmailIdentity
                - ses:DeleteEmailIdentity
                - ses:GetEmailIdentity
                - ses:SendEmail
              Resource: "*"
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
                - scheduler:UpdateSchedule
              Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${EmailScheduleGroup}/*
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerTargetRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: scheduler.amazonaws.com
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  WorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/aws/worker.ts
        Format: esm
        Minify: true
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Target: es2022
    Properties:
      CodeUri: .
      Handler: src/aws/worker.handler
      ReservedConcurrentExecutions: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobQueue.QueueName
        - S3ReadPolicy:
            BucketName: !Ref PayloadBucket
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
                - scheduler:UpdateSchedule
              Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${EmailScheduleGroup}/*
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerTargetRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: scheduler.amazonaws.com
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 10

  SesEventsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/aws/ses-events.ts
        Format: esm
        Minify: true
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Target: es2022
    Properties:
      CodeUri: .
      Handler: src/aws/ses-events.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobQueue.QueueName
      Events:
        SesEvents:
          Type: SNS
          Properties:
            Topic: !Ref SesEventTopic

  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  PayloadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireEmailPayloads
            Status: Enabled
            ExpirationInDays: 45
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  SchedulerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      VisibilityTimeout: 180
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  EmailScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup

  SchedulerTargetRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
                AWS:SourceArn: !GetAtt EmailScheduleGroup.Arn
      Policies:
        - PolicyName: DeliverScheduledEmailJob
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - !GetAtt JobQueue.Arn
                  - !GetAtt SchedulerDeadLetterQueue.Arn

  SesEventTopic:
    Type: AWS::SNS::Topic

  BootstrapSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateBootstrapSecret
    Properties:
      Description: !Sub Bootstrap administrator key for ${AWS::StackName}. Use only to issue scoped application keys.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  AlarmTopic:
    Type: AWS::SNS::Topic

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HayaSend jobs have reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  SchedulerDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: EventBridge Scheduler could not deliver an email job.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SchedulerDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  SchedulerDroppedInvocationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: EventBridge Scheduler exhausted delivery retries.
      Namespace: AWS/Scheduler
      MetricName: InvocationDroppedCount
      Dimensions:
        - Name: ScheduleGroup
          Value: !Ref EmailScheduleGroup
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HayaSend's oldest queued job is more than five minutes old.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HayaSend returned an internal API error.
      Namespace: HayaSend
      MetricName: ApiErrors
      Dimensions:
        - Name: Service
          Value: HayaSend
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  SendFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HayaSend exhausted retries for an outbound message.
      Namespace: HayaSend
      MetricName: SendFailures
      Dimensions:
        - Name: Service
          Value: HayaSend
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ComplaintAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Amazon SES reported a recipient complaint.
      Namespace: HayaSend
      MetricName: Complaints
      Dimensions:
        - Name: Service
          Value: HayaSend
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-operations
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Email safety events",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["HayaSend", "SuppressedEmails", "Service", "HayaSend"],
                  [".", "PermanentBounces", ".", "."],
                  [".", "Complaints", ".", "."],
                  [".", "SendFailures", ".", "."]
                ]
              }
            },
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Queue health",
                "region": "${AWS::Region}",
                "stat": "Maximum",
                "period": 60,
                "metrics": [
                  ["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${JobQueue.QueueName}"],
                  [".", "ApproximateNumberOfMessagesVisible", ".", "${DeadLetterQueue.QueueName}"],
                  [".", "ApproximateNumberOfMessagesVisible", ".", "${SchedulerDeadLetterQueue.QueueName}"],
                  ["AWS/Scheduler", "TargetErrorCount", "ScheduleGroup", "${EmailScheduleGroup}"],
                  ["AWS/Scheduler", "InvocationDroppedCount", "ScheduleGroup", "${EmailScheduleGroup}"]
                ]
              }
            }
          ]
        }

  SesEventTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SesEventTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSesPublish
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SesEventTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  ConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub ${AWS::StackName}-events

  ConfigurationSetEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Enabled: true
        MatchingEventTypes:
          - send
          - reject
          - bounce
          - complaint
          - delivery
          - renderingFailure
          - deliveryDelay
          - open
          - click
        SnsDestination:
          TopicARN: !Ref SesEventTopic

Outputs:
  ApiBaseUrl:
    Description: Set this as RESEND_BASE_URL when using the official Resend Node SDK.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  QueueArn:
    Value: !GetAtt JobQueue.Arn
  EmailScheduleGroupName:
    Value: !Ref EmailScheduleGroup
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  SchedulerDeadLetterQueueUrl:
    Value: !Ref SchedulerDeadLetterQueue
  TableName:
    Value: !Ref DataTable
  PayloadBucketName:
    Value: !Ref PayloadBucket
  ConfigurationSetName:
    Value: !Ref ConfigurationSet
  BootstrapSecretArn:
    Description: Retrieve this secret to issue least-privilege application keys.
    Value: !If
      - CreateBootstrapSecret
      - !Ref BootstrapSecret
      - !Ref BootstrapSecretArn
  AlarmTopicArn:
    Description: Subscribe an operational notification endpoint to this topic.
    Value: !Ref AlarmTopic
  OperationsDashboardName:
    Value: !Ref OperationsDashboard
