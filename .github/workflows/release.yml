name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.164.0
      - name: Install npm
        run: npm install --global --ignore-scripts npm@12.0.1

      - name: Validate release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node --print "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package.json version ${package_version}."
            exit 1
          fi
          if ! printf '%s\n' "$package_version" |
            grep --extended-regexp --quiet \
              '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::package.json version is not a supported SemVer value."
            exit 1
          fi
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          if [ "$(jq --raw-output '.object.type' <<< "$tag_ref")" != "tag" ]; then
            echo "::error::Release tags must be signed annotated tags, not lightweight tags."
            exit 1
          fi
          tag_object_sha="$(jq --raw-output '.object.sha' <<< "$tag_ref")"
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          if [ "$(jq --raw-output '.verification.verified' <<< "$tag_object")" != "true" ]; then
            reason="$(jq --raw-output '.verification.reason' <<< "$tag_object")"
            echo "::error::GitHub could not verify the release tag signature (${reason})."
            exit 1
          fi
          if [ "$(jq --raw-output '.object.type' <<< "$tag_object")" != "commit" ] ||
            [ "$(jq --raw-output '.object.sha' <<< "$tag_object")" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag must point directly at the workflow commit."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit is not reachable from the protected main branch."
            exit 1
          fi
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate CloudFormation
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.53.2
          cfn-lint template.yaml
      - name: Validate OpenAPI
        run: npm run lint:openapi
      - name: Build and load Lambda bundles
        run: |
          sam build
          node scripts/verify-lambda-bundles.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: >-
            image=docker.io/moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and publish container
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: >-
            generator=docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          provenance: mode=max
      - name: Attest container provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release
          archive="hayasend-${VERSION}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="hayasend-${VERSION}/" \
            --output="release/${archive}" \
            "$RELEASE_TAG"
          cp openapi.yaml "release/hayasend-${VERSION}-openapi.yaml"
          cp template.yaml "release/hayasend-${VERSION}-aws-sam.yaml"
          npm sbom --omit=dev --sbom-format cyclonedx \
            > "release/hayasend-${VERSION}.cdx.json"
          (
            cd release
            sha256sum \
              "$archive" \
              "hayasend-${VERSION}-openapi.yaml" \
              "hayasend-${VERSION}-aws-sam.yaml" \
              "hayasend-${VERSION}.cdx.json" \
              > SHA256SUMS
          )
      - name: Attest release asset provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release/*
      - name: Attest source SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release/hayasend-${{ steps.version.outputs.version }}.tar.gz
          sbom-path: release/hayasend-${{ steps.version.outputs.version }}.cdx.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
