            ([.files[].path] | index("app.ts") != null) and
            ([.files[].path] | index("api/queue.ts") != null) and
            ([.files[].path] | index("api/reconcile.ts") != null) and
            ([.files[].path] | index("vercel.json") != null) and
            ([.files[].path] |
