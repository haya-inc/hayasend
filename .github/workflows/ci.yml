name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Validate CloudFormation
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.53.2
          cfn-lint template.yaml
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.12.5 lint openapi.yaml
      - name: Bundle Lambda entry points
        run: >
          npx esbuild
          src/aws/api.ts
          src/aws/inbound.ts
          src/aws/worker.ts
          src/aws/ses-events.ts
          --bundle
          --platform=node
          --target=node22
          --format=esm
          --outdir=/tmp/hayasend-esbuild
