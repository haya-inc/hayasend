          test -x "$package_root/deploy/railway/rollback.sh"
          test -x "$package_root/deploy/railway/cleanup.sh"
          test -f "$package_root/deploy/flyio/fly.toml"
          test -f "$package_root/deploy/flyio/.flyctl-version"
          test -f \
