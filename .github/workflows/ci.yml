          test -x "$consumer/node_modules/.bin/esbuild"
          npm_root="$(npm root --global)"
          npm_compat="$RUNNER_TEMP/npm-sam-compat"
          mkdir "$npm_compat"
          cp "$package_root/scripts/npm-sam-compat.mjs" "$npm_compat/npm"
