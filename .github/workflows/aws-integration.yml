name: AWS integration

on:
  workflow_dispatch:
    inputs:
      retain_stack:
        description: Retain the ephemeral stack for manual debugging
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: hayasend-aws-integration
  cancel-in-progress: false

jobs:
  deploy-test-delete:
    name: Deploy, test, and delete
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: aws-integration
    env:
      AWS_REGION: ${{ vars.AWS_TEST_REGION || 'ap-northeast-1' }}
      AWS_TEST_ACCOUNT_ID: ${{ vars.AWS_TEST_ACCOUNT_ID }}
      AWS_TEST_ROLE_ARN: ${{ vars.AWS_TEST_ROLE_ARN }}
      STACK_NAME: hayasend-it-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate dedicated-account configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]] ||
            [[ "${GITHUB_REF_PROTECTED:-false}" != "true" ]]; then
            echo "::error::The AWS hosted proof must run from protected main."
            exit 1
          fi
          if [[ ! "$AWS_TEST_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_TEST_ACCOUNT_ID must be a 12-digit environment variable."
            exit 1
          fi
          expected_prefix="arn:aws:iam::${AWS_TEST_ACCOUNT_ID}:role/"
          if [[ "$AWS_TEST_ROLE_ARN" != "$expected_prefix"* ]]; then
            echo "::error::AWS_TEST_ROLE_ARN must name a role in AWS_TEST_ACCOUNT_ID."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.164.0

      - name: Install npm
        run: npm install --global --ignore-scripts npm@12.0.1

      - name: Install dependencies
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Configure short-lived AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_TEST_ACCOUNT_ID }}
          role-session-name: HayaSend-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account" = "$AWS_TEST_ACCOUNT_ID"

      - name: Plan ephemeral stack
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent cli -- deploy aws \
            --account "$AWS_TEST_ACCOUNT_ID" \
            --stack "$STACK_NAME" \
            --region "$AWS_REGION" \
            --api-rate-limit 7.5 \
            --api-burst-limit 11 \
            --worker-reserved-concurrency 0 \
            --log-retention-days 7 \
            --tag Purpose=IntegrationTest \
            --tag "GitHubRun=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/hayasend-deploy-plan.json"
          node -e \
            'const plan = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (plan.parameters.ApiThrottlingRateLimit !== "7.5" || plan.parameters.ApiThrottlingBurstLimit !== "11") process.exit(1)' \
            "$RUNNER_TEMP/hayasend-deploy-plan.json"

      - name: Deploy reviewed ephemeral stack
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent cli -- deploy aws \
            --account "$AWS_TEST_ACCOUNT_ID" \
            --stack "$STACK_NAME" \
            --region "$AWS_REGION" \
            --api-rate-limit 7.5 \
            --api-burst-limit 11 \
            --worker-reserved-concurrency 0 \
            --log-retention-days 7 \
            --tag Purpose=IntegrationTest \
            --tag "GitHubRun=$GITHUB_RUN_ID" \
            --apply \
            > "$RUNNER_TEMP/hayasend-deploy-result.jsonl"
          node -e \
            'require("node:fs").readFileSync(process.argv[1], "utf8").trim().split("\n").forEach(JSON.parse)' \
            "$RUNNER_TEMP/hayasend-deploy-result.jsonl"

      - name: Capture stack outputs
        shell: bash
        run: |
          set -euo pipefail
          stack_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }
          stack_resource() {
            aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?LogicalResourceId=='$1'].PhysicalResourceId | [0]" \
              --output text
          }
          api_base_url="$(stack_output ApiBaseUrl)"
          http_api_id="$(
            aws cloudformation describe-stack-resource \
              --stack-name "$STACK_NAME" \
              --logical-resource-id HttpApi \
              --region "$AWS_REGION" \
              --query StackResourceDetail.PhysicalResourceId \
              --output text
          )"
          bootstrap_secret_arn="$(stack_output BootstrapSecretArn)"
          payload_bucket="$(stack_output PayloadBucketName)"
          data_table="$(stack_output TableName)"
          dispatcher_function="$(stack_output DispatcherFunctionName)"
          schedule_group="$(stack_output EmailScheduleGroupName)"
          api_log_group="$(stack_output ApiLogGroupName)"
          worker_log_group="$(stack_output WorkerLogGroupName)"
          dispatcher_log_group="$(stack_output DispatcherLogGroupName)"
          ses_events_log_group="$(stack_output SesEventsLogGroupName)"
          retention_log_group="$(stack_output LogRetentionFunctionLogGroupName)"
          api_function="$(stack_resource ApiFunction)"
          worker_function="$(stack_resource WorkerFunction)"
          ses_events_function="$(stack_resource SesEventsFunction)"
          legacy_retention_resource="$(
            stack_resource LegacyFunctionLogRetention
          )"
          for value in \
            "$api_base_url" \
            "$http_api_id" \
            "$bootstrap_secret_arn" \
            "$payload_bucket" \
            "$data_table" \
            "$dispatcher_function" \
            "$schedule_group" \
            "$api_log_group" \
            "$worker_log_group" \
            "$dispatcher_log_group" \
            "$ses_events_log_group" \
            "$retention_log_group" \
            "$api_function" \
            "$worker_function" \
            "$ses_events_function" \
            "$legacy_retention_resource"; do
            if [[ -z "$value" || "$value" = "None" ]]; then
              echo "::error::A required CloudFormation output is missing."
              exit 1
            fi
          done
          {
            echo "API_BASE_URL=$api_base_url"
            echo "HTTP_API_ID=$http_api_id"
            echo "BOOTSTRAP_SECRET_ARN=$bootstrap_secret_arn"
            echo "PAYLOAD_BUCKET=$payload_bucket"
            echo "DATA_TABLE=$data_table"
            echo "DISPATCHER_FUNCTION=$dispatcher_function"
            echo "SCHEDULE_GROUP=$schedule_group"
            echo "MANAGED_LOG_GROUPS=$api_log_group $worker_log_group $dispatcher_log_group $ses_events_log_group $retention_log_group"
            echo "LEGACY_LOG_GROUPS=/aws/lambda/$api_function /aws/lambda/$worker_function /aws/lambda/$dispatcher_function /aws/lambda/$ses_events_function"
            echo "LEGACY_RETENTION_RESOURCE=$legacy_retention_resource"
          } >> "$GITHUB_ENV"

      - name: Prove legacy log-group adoption
        shell: bash
        run: |
          set -euo pipefail
          for log_group in $LEGACY_LOG_GROUPS; do
            aws logs create-log-group \
              --log-group-name "$log_group" \
              --region "$AWS_REGION"
          done

          npm run --silent cli -- deploy aws \
            --account "$AWS_TEST_ACCOUNT_ID" \
            --stack "$STACK_NAME" \
            --region "$AWS_REGION" \
            --worker-reserved-concurrency 0 \
            --log-retention-days 14 \
            --allow-destructive-changes \
            --tag Purpose=IntegrationTest \
            --tag "GitHubRun=$GITHUB_RUN_ID" \
            --apply \
            > "$RUNNER_TEMP/hayasend-retention-update.jsonl"
          node -e \
            'require("node:fs").readFileSync(process.argv[1], "utf8").trim().split("\n").forEach(JSON.parse)' \
            "$RUNNER_TEMP/hayasend-retention-update.jsonl"

          updated_retention_resource="$(
            aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?LogicalResourceId=='LegacyFunctionLogRetention'].PhysicalResourceId | [0]" \
              --output text
          )"
          if [[ "$updated_retention_resource" != "$LEGACY_RETENTION_RESOURCE" ]]; then
            echo "::error::The legacy retention custom resource was replaced during update."
            exit 1
          fi

          stack_rate="$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Parameters[?ParameterKey=='ApiThrottlingRateLimit'].ParameterValue | [0]" \
              --output text
          )"
          stack_burst="$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Parameters[?ParameterKey=='ApiThrottlingBurstLimit'].ParameterValue | [0]" \
              --output text
          )"
          stage_name="\$default"
          stage_rate="$(
            aws apigatewayv2 get-stage \
              --api-id "$HTTP_API_ID" \
              --stage-name "$stage_name" \
              --region "$AWS_REGION" \
              --query DefaultRouteSettings.ThrottlingRateLimit \
              --output text
          )"
          stage_burst="$(
            aws apigatewayv2 get-stage \
              --api-id "$HTTP_API_ID" \
              --stage-name "$stage_name" \
              --region "$AWS_REGION" \
              --query DefaultRouteSettings.ThrottlingBurstLimit \
              --output text
          )"
          if [[ "$stack_rate" != "7.5" || "$stack_burst" != "11" ||
                "$stage_rate" != "7.5" || "$stage_burst" != "11" ]]; then
            echo "::error::The configured API throttle was not preserved by the update."
            exit 1
          fi

          for log_group in $MANAGED_LOG_GROUPS $LEGACY_LOG_GROUPS; do
            retention="$(
              aws logs describe-log-groups \
                --log-group-name-prefix "$log_group" \
                --region "$AWS_REGION" \
                --query "logGroups[?logGroupName=='$log_group'].retentionInDays | [0]" \
                --output text
            )"
            if [[ "$retention" != "14" ]]; then
              echo "::error::$log_group has retention $retention instead of 14 days."
              exit 1
            fi
          done

          inbound_count="$(
            aws logs describe-log-groups \
              --log-group-name-prefix "/hayasend/$STACK_NAME/inbound" \
              --region "$AWS_REGION" \
              --query "length(logGroups[?logGroupName=='/hayasend/$STACK_NAME/inbound'])" \
              --output text
          )"
          if [[ "$inbound_count" != "0" ]]; then
            echo "::error::Inbound-disabled deployment created an inbound log group."
            exit 1
          fi

      - name: Exercise deployed API
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_key="$(
            aws secretsmanager get-secret-value \
              --secret-id "$BOOTSTRAP_SECRET_ARN" \
              --query SecretString \
              --output text
          )"
          echo "::add-mask::$bootstrap_key"
          HAYASEND_BASE_URL="$API_BASE_URL" \
          HAYASEND_EXPECTED_API_ID="$HTTP_API_ID" \
          HAYASEND_BOOTSTRAP_KEY="$bootstrap_key" \
          node scripts/aws-integration.mjs \
            | tee "$RUNNER_TEMP/hayasend-aws-evidence.json"

      - name: Prove durable outbox recovery
        shell: bash
        run: |
          set -euo pipefail
          email_id="$(
            node -e \
              'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).recovery_email_id)' \
              "$RUNNER_TEMP/hayasend-aws-evidence.json"
          )"
          if [[ ! "$email_id" =~ ^email_[A-Za-z0-9_-]{16,128}$ ]]; then
            echo "::error::The integration probe did not return a valid email ID."
            exit 1
          fi
          outbox_id="outbox:v1:${email_id}:dispatch-message:0"
          partition_key="OUTBOX#${outbox_id}"
          now_iso="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"
          key="$(
            jq -cn \
              --arg value "$partition_key" \
              '{PK:{S:$value},SK:{S:$value}}'
          )"
          names='{"#entity":"entity","#due":"due_at","#updated":"updated_at","#lease_owner":"lease_owner","#lease_expires":"lease_expires_at","#dispatched":"dispatched_at"}'
          values="$(
            jq -cn \
              --arg now "$now_iso" \
              --arg partition "OUTBOX_DUE" \
              --arg sort "${now_iso}#${outbox_id}" \
              '{":now":{S:$now},":partition":{S:$partition},":sort":{S:$sort}}'
          )"
          aws dynamodb update-item \
            --table-name "$DATA_TABLE" \
            --region "$AWS_REGION" \
            --key "$key" \
            --condition-expression "attribute_exists(PK) AND attribute_not_exists(#entity.#dispatched)" \
            --update-expression "SET #entity.#due = :now, #entity.#updated = :now, GSI1PK = :partition, GSI1SK = :sort REMOVE #entity.#lease_owner, #entity.#lease_expires" \
            --expression-attribute-names "$names" \
            --expression-attribute-values "$values"

          item='{}'
          for attempt in {1..12}; do
            aws lambda invoke \
              --function-name "$DISPATCHER_FUNCTION" \
              --region "$AWS_REGION" \
              --cli-binary-format raw-in-base64-out \
              --payload '{}' \
              "$RUNNER_TEMP/dispatcher-result-${attempt}.json" \
              > "$RUNNER_TEMP/dispatcher-metadata-${attempt}.json"
            node -e \
              'const fs=require("node:fs"); const metadata=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (metadata.FunctionError) throw new Error("Dispatcher invocation failed.");' \
              "$RUNNER_TEMP/dispatcher-metadata-${attempt}.json"
            item="$(
              aws dynamodb get-item \
                --table-name "$DATA_TABLE" \
                --region "$AWS_REGION" \
                --key "$key" \
                --consistent-read \
                --query Item \
                --output json
            )"
            if jq -e '.entity.M.dispatched_at.S' <<< "$item" >/dev/null; then
              break
            fi
            sleep 5
          done
          jq -e \
            '.entity.M.dispatched_at.S and
             (.entity.M.lease_owner == null) and
             (.entity.M.lease_expires_at == null) and
             (.GSI1PK == null) and
             (.GSI1SK == null)' \
            <<< "$item" >/dev/null

      - name: Show CloudFormation failure events
        if: ${{ failure() && steps.aws-credentials.outcome == 'success' }}
        shell: bash
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatusReason!=null].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason] | [:20]" \
            --output table || true

      - name: Delete ephemeral resources
        if: ${{ always() && !inputs.retain_stack && steps.aws-credentials.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          stack_exists=false
          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            stack_exists=true
          fi

          resource_id() {
            aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?LogicalResourceId=='$1'].PhysicalResourceId | [0]" \
              --output text
          }

          if [[ "$stack_exists" = true ]]; then
            if [[ -z "${PAYLOAD_BUCKET:-}" || "$PAYLOAD_BUCKET" = "None" ]]; then
              PAYLOAD_BUCKET="$(resource_id PayloadBucket)"
            fi
            if [[ -z "${DATA_TABLE:-}" || "$DATA_TABLE" = "None" ]]; then
              DATA_TABLE="$(resource_id DataTable)"
            fi
            if [[ -z "${SCHEDULE_GROUP:-}" || "$SCHEDULE_GROUP" = "None" ]]; then
              SCHEDULE_GROUP="$(resource_id EmailScheduleGroup)"
            fi
            if [[ -z "${LEGACY_LOG_GROUPS:-}" ]]; then
              api_function="$(resource_id ApiFunction)"
              worker_function="$(resource_id WorkerFunction)"
              dispatcher_function="$(resource_id DispatcherFunction)"
              ses_events_function="$(resource_id SesEventsFunction)"
              LEGACY_LOG_GROUPS="/aws/lambda/$api_function /aws/lambda/$worker_function /aws/lambda/$dispatcher_function /aws/lambda/$ses_events_function"
            fi
          fi

          aws sesv2 delete-email-identity \
            --email-identity "it-${GITHUB_RUN_ID}.example.com" \
            --region "$AWS_REGION" >/dev/null 2>&1 || true

          if [[ -n "${SCHEDULE_GROUP:-}" && "$SCHEDULE_GROUP" != "None" ]]; then
            schedule_names="$(
              aws scheduler list-schedules \
                --group-name "$SCHEDULE_GROUP" \
                --region "$AWS_REGION" \
                --query "Schedules[].Name" \
                --output text 2>/dev/null || true
            )"
            for schedule_name in $schedule_names; do
              aws scheduler delete-schedule \
                --group-name "$SCHEDULE_GROUP" \
                --name "$schedule_name" \
                --region "$AWS_REGION"
            done
          fi

          if [[ "$stack_exists" = true ]]; then
            sam delete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --no-prompts || {
                aws cloudformation delete-stack \
                  --stack-name "$STACK_NAME" \
                  --region "$AWS_REGION"
                aws cloudformation wait stack-delete-complete \
                  --stack-name "$STACK_NAME" \
                  --region "$AWS_REGION"
              }
          fi

          if [[ -n "${PAYLOAD_BUCKET:-}" && "$PAYLOAD_BUCKET" != "None" ]] &&
            aws s3api head-bucket --bucket "$PAYLOAD_BUCKET" >/dev/null 2>&1; then
            aws s3 rm "s3://$PAYLOAD_BUCKET" --recursive
            aws s3api delete-bucket \
              --bucket "$PAYLOAD_BUCKET" \
              --region "$AWS_REGION"
          fi

          if [[ -n "${DATA_TABLE:-}" && "$DATA_TABLE" != "None" ]] &&
            aws dynamodb describe-table \
              --table-name "$DATA_TABLE" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
            aws dynamodb delete-table \
              --table-name "$DATA_TABLE" \
              --region "$AWS_REGION" >/dev/null
            aws dynamodb wait table-not-exists \
              --table-name "$DATA_TABLE" \
              --region "$AWS_REGION"
          fi

          log_group_prefix="/aws/lambda/${STACK_NAME}-"
          legacy_log_groups="$(
            aws logs describe-log-groups \
              --log-group-name-prefix "$log_group_prefix" \
              --region "$AWS_REGION" \
              --query "logGroups[].logGroupName" \
              --output text 2>/dev/null || true
          )"
          for log_group in $legacy_log_groups; do
            aws logs delete-log-group \
              --log-group-name "$log_group" \
              --region "$AWS_REGION"
          done

          managed_log_groups=""
          for attempt in {1..12}; do
            managed_log_groups="$(
              aws logs describe-log-groups \
                --log-group-name-prefix "/hayasend/$STACK_NAME/" \
                --region "$AWS_REGION" \
                --query "logGroups[].logGroupName" \
                --output text 2>/dev/null || true
            )"
            if [[ -z "$managed_log_groups" ]]; then
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          for log_group in $managed_log_groups; do
            echo "::error::Stack-owned log group remained after stack deletion: $log_group"
            aws logs delete-log-group \
              --log-group-name "$log_group" \
              --region "$AWS_REGION"
          done

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "::error::CloudFormation stack still exists after cleanup."
            exit 1
          fi
          remaining_legacy_log_groups="$(
            aws logs describe-log-groups \
              --log-group-name-prefix "$log_group_prefix" \
              --region "$AWS_REGION" \
              --query "logGroups[].logGroupName" \
              --output text
          )"
          if [[ -n "$remaining_legacy_log_groups" ]]; then
            echo "::error::Legacy Lambda log groups still exist after cleanup."
            exit 1
          fi
          if [[ -n "$managed_log_groups" ]]; then
            exit 1
          fi

      - name: Record retained stack
        if: ${{ always() && inputs.retain_stack && steps.aws-credentials.outcome == 'success' }}
        shell: bash
        run: |
          {
            echo "### AWS integration resources retained"
            echo
            echo "Stack: \`$STACK_NAME\`"
            echo "Region: \`$AWS_REGION\`"
            echo
            echo "Delete it manually as soon as debugging is complete."
          } >> "$GITHUB_STEP_SUMMARY"
