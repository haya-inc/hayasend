name: AWS integration

on:
  workflow_dispatch:
    inputs:
      retain_stack:
        description: Retain the ephemeral stack for manual debugging
        type: boolean
        required: false
        default: false
      prove_backup_restore:
        description: Run an isolated AWS Backup semantic restore proof
        type: boolean
        required: false
        default: false
      prove_canary_rollback:
        description: Force one alarm-driven Lambda canary rollback and verify recovery
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: hayasend-aws-integration
  cancel-in-progress: false

jobs:
  deploy-test-delete:
    name: Deploy, test, and delete
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment: aws-integration
    env:
      AWS_REGION: ${{ vars.AWS_TEST_REGION || 'ap-northeast-1' }}
      AWS_TEST_ACCOUNT_ID: ${{ vars.AWS_TEST_ACCOUNT_ID }}
      AWS_TEST_ROLE_ARN: ${{ vars.AWS_TEST_ROLE_ARN }}
      STACK_NAME: hayasend-it-${{ github.run_id }}-${{ github.run_attempt }}
      PROVE_BACKUP_RESTORE: ${{ inputs.prove_backup_restore }}
      PROVE_CANARY_ROLLBACK: ${{ inputs.prove_canary_rollback }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate dedicated-account configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]] ||
            [[ "${GITHUB_REF_PROTECTED:-false}" != "true" ]]; then
            echo "::error::The AWS hosted proof must run from protected main."
            exit 1
          fi
          if [[ ! "$AWS_TEST_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_TEST_ACCOUNT_ID must be a 12-digit environment variable."
            exit 1
          fi
          expected_prefix="arn:aws:iam::${AWS_TEST_ACCOUNT_ID}:role/"
          if [[ "$AWS_TEST_ROLE_ARN" != "$expected_prefix"* ]]; then
            echo "::error::AWS_TEST_ROLE_ARN must name a role in AWS_TEST_ACCOUNT_ID."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.164.0

      - name: Install npm
        run: npm install --global --ignore-scripts npm@12.0.1

      - name: Install dependencies
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Configure short-lived AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_TEST_ACCOUNT_ID }}
          role-session-name: HayaSend-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: ${{ inputs.prove_backup_restore && 21600 || 3600 }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account" = "$AWS_TEST_ACCOUNT_ID"

      - name: Plan ephemeral stack
        shell: bash
        run: |
          set -euo pipefail
          backup_flags=(--disable-backups --disable-restore-testing)
          if [[ "$PROVE_BACKUP_RESTORE" = "true" ]]; then
            backup_flags=(--enable-backups --enable-restore-testing --backup-retention-days 1)
          fi
          npm run --silent cli -- deploy aws \
            --account "$AWS_TEST_ACCOUNT_ID" \
            --stack "$STACK_NAME" \
            --region "$AWS_REGION" \
            --api-rate-limit 7.5 \
            --api-burst-limit 11 \
            --worker-reserved-concurrency 0 \
            --log-retention-days 7 \
            "${backup_flags[@]}" \
            --tag Purpose=IntegrationTest \
            --tag "GitHubRun=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/hayasend-deploy-plan.json"
          node -e \
            'const plan = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); const expected=process.env.PROVE_BACKUP_RESTORE==="true"; if (plan.parameters.ApiThrottlingRateLimit !== "7.5" || plan.parameters.ApiThrottlingBurstLimit !== "11" || plan.parameters.EnableGradualDeployments !== "false" || plan.parameters.EnableBackups !== String(expected) || plan.parameters.EnableRestoreTesting !== String(expected) || plan.backups.enabled !== expected || plan.backups.restore_testing.enabled !== expected || plan.deployments.mode !== "alias_bootstrap") process.exit(1)' \
            "$RUNNER_TEMP/hayasend-deploy-plan.json"

      - name: Deploy reviewed ephemeral stack
        shell: bash
        run: |
          set -euo pipefail
          backup_flags=(--disable-backups --disable-restore-testing)
          if [[ "$PROVE_BACKUP_RESTORE" = "true" ]]; then
            backup_flags=(--enable-backups --enable-restore-testing --backup-retention-days 1)
          fi
          npm run --silent cli -- deploy aws \
            --account "$AWS_TEST_ACCOUNT_ID" \
            --stack "$STACK_NAME" \
            --region "$AWS_REGION" \
            --api-rate-limit 7.5 \
            --api-burst-limit 11 \
            --worker-reserved-concurrency 0 \
            --log-retention-days 7 \
            "${backup_flags[@]}" \
            --tag Purpose=IntegrationTest \
            --tag "GitHubRun=$GITHUB_RUN_ID" \
            --apply \
            > "$RUNNER_TEMP/hayasend-deploy-result.jsonl"
          node -e \
            'const rows=require("node:fs").readFileSync(process.argv[1], "utf8").trim().split("\n").map(JSON.parse); const result=rows.find((row)=>row.object==="aws_deployment_result"); if (!result || result.deployments.enabled !== false || result.deployments.aliases_ready !== true || !result.next.enable_gradual_deployments) process.exit(1)' \
            "$RUNNER_TEMP/hayasend-deploy-result.jsonl"

      - name: Capture stack outputs
        shell: bash
        run: |
          set -euo pipefail
          stack_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }
          stack_resource() {
            aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?LogicalResourceId=='$1'].PhysicalResourceId | [0]" \
              --output text
          }
          stack_parameter() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Parameters[?ParameterKey=='$1'].ParameterValue | [0]" \
              --output text
          }
          api_base_url="$(stack_output ApiBaseUrl)"
          http_api_id="$(
            aws cloudformation describe-stack-resource \
              --stack-name "$STACK_NAME" \
              --logical-resource-id HttpApi \
              --region "$AWS_REGION" \
              --query StackResourceDetail.PhysicalResourceId \
              --output text
          )"
          bootstrap_secret_arn="$(stack_output BootstrapSecretArn)"
          payload_bucket="$(stack_output PayloadBucketName)"
          data_table="$(stack_output TableName)"
          backup_vault_arn="$(stack_output BackupVaultArn)"
          backup_service_role_arn="$(stack_output BackupServiceRoleArn)"
          restore_testing_plan_arn="$(stack_output RestoreTestingPlanArn)"
          restore_testing_plan_name="$(
            stack_parameter RestoreTestingPlanName
          )"
          restore_testing_service_role_arn="$(
            stack_output RestoreTestingServiceRoleArn
          )"
          dispatcher_function="$(stack_output DispatcherFunctionName)"
          schedule_group="$(stack_output EmailScheduleGroupName)"
          api_log_group="$(stack_output ApiLogGroupName)"
          worker_log_group="$(stack_output WorkerLogGroupName)"
          dispatcher_log_group="$(stack_output DispatcherLogGroupName)"
          ses_events_log_group="$(stack_output SesEventsLogGroupName)"
          retention_log_group="$(stack_output LogRetentionFunctionLogGroupName)"
          api_function="$(stack_resource ApiFunction)"
          worker_function="$(stack_resource WorkerFunction)"
          ses_events_function="$(stack_resource SesEventsFunction)"
          api_alias_alarm="$(stack_resource ApiFunctionAliasErrorAlarm)"
          legacy_retention_resource="$(
            stack_resource LegacyFunctionLogRetention
          )"
          for value in \
            "$api_base_url" \
            "$http_api_id" \
            "$bootstrap_secret_arn" \
            "$payload_bucket" \
            "$data_table" \
            "$dispatcher_function" \
            "$schedule_group" \
            "$api_log_group" \
            "$worker_log_group" \
            "$dispatcher_log_group" \
            "$ses_events_log_group" \
            "$retention_log_group" \
            "$api_function" \
            "$worker_function" \
            "$ses_events_function" \
            "$api_alias_alarm" \
            "$legacy_retention_resource"; do
            if [[ -z "$value" || "$value" = "None" ]]; then
              echo "::error::A required CloudFormation output is missing."
              exit 1
            fi
          done
          if [[ "$PROVE_BACKUP_RESTORE" = "true" ]]; then
            for value in \
              "$backup_vault_arn" \
              "$backup_service_role_arn" \
              "$restore_testing_plan_arn" \
              "$restore_testing_plan_name" \
              "$restore_testing_service_role_arn"; do
              if [[ -z "$value" || "$value" = "None" ]]; then
                echo "::error::A required AWS Backup output is missing."
                exit 1
              fi
            done
          fi
          {
            echo "API_BASE_URL=$api_base_url"
            echo "HTTP_API_ID=$http_api_id"
            echo "BOOTSTRAP_SECRET_ARN=$bootstrap_secret_arn"
            echo "PAYLOAD_BUCKET=$payload_bucket"
            echo "DATA_TABLE=$data_table"
            echo "BACKUP_VAULT_ARN=$backup_vault_arn"
            echo "BACKUP_SERVICE_ROLE_ARN=$backup_service_role_arn"
            echo "RESTORE_TESTING_PLAN_ARN=$restore_testing_plan_arn"
            echo "RESTORE_TESTING_PLAN_NAME=$restore_testing_plan_name"
            echo "RESTORE_TESTING_SERVICE_ROLE_ARN=$restore_testing_service_role_arn"
            echo "BACKUP_PROOF_STATE=$RUNNER_TEMP/hayasend-backup-proof-state.json"
            echo "API_FUNCTION=$api_function"
            echo "API_ALIAS_ALARM=$api_alias_alarm"
            echo "DISPATCHER_FUNCTION=$dispatcher_function"
            echo "SCHEDULE_GROUP=$schedule_group"
            echo "MANAGED_LOG_GROUPS=$api_log_group $worker_log_group $dispatcher_log_group $ses_events_log_group $retention_log_group"
            echo "LEGACY_LOG_GROUPS=/aws/lambda/$api_function /aws/lambda/$worker_function /aws/lambda/$dispatcher_function /aws/lambda/$ses_events_function"
            echo "LEGACY_RETENTION_RESOURCE=$legacy_retention_resource"
          } >> "$GITHUB_ENV"

      - name: Prove legacy log-group adoption
        shell: bash
        run: |
          set -euo pipefail
          backup_flags=(--disable-backups --disable-restore-testing)
          if [[ "$PROVE_BACKUP_RESTORE" = "true" ]]; then
            backup_flags=(--enable-backups --enable-restore-testing --backup-retention-days 1)
          fi
          for log_group in $LEGACY_LOG_GROUPS; do
            aws logs create-log-group \
              --log-group-name "$log_group" \
              --region "$AWS_REGION"
          done

          npm run --silent cli -- upgrade aws \
            --account "$AWS_TEST_ACCOUNT_ID" \
            --stack "$STACK_NAME" \
            --region "$AWS_REGION" \
            --worker-reserved-concurrency 0 \
            --log-retention-days 14 \
            "${backup_flags[@]}" \
            --allow-destructive-changes \
            --tag Purpose=IntegrationTest \
            --tag "GitHubRun=$GITHUB_RUN_ID" \
            --apply \
            > "$RUNNER_TEMP/hayasend-retention-update.jsonl"
          node -e \
            'require("node:fs").readFileSync(process.argv[1], "utf8").trim().split("\n").forEach(JSON.parse)' \
            "$RUNNER_TEMP/hayasend-retention-update.jsonl"

          npm run --silent cli -- status aws \
            --account "$AWS_TEST_ACCOUNT_ID" \
            --stack "$STACK_NAME" \
            --region "$AWS_REGION" \
            --detect-drift \
            > "$RUNNER_TEMP/hayasend-status.json"
          node -e \
            'const value=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); const expected=process.env.PROVE_BACKUP_RESTORE==="true"; if (value.stack.termination_protection !== true || value.stack.stack_policy.retained_resources_protected !== true || value.stack.drift.status !== "IN_SYNC" || value.stack.drift.detected_now !== true || value.stack.deployments.enabled !== true || value.stack.deployments.aliases_ready !== true || value.stack.deployments.deployment_groups_ready !== true || value.stack.backups.enabled !== expected || value.stack.backups.resources_ready !== true || value.stack.backups.restore_testing.enabled !== expected || value.stack.backups.restore_testing.resources_ready !== true) process.exit(1)' \
            "$RUNNER_TEMP/hayasend-status.json"

          updated_retention_resource="$(
            aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?LogicalResourceId=='LegacyFunctionLogRetention'].PhysicalResourceId | [0]" \
              --output text
          )"
          if [[ "$updated_retention_resource" != "$LEGACY_RETENTION_RESOURCE" ]]; then
            echo "::error::The legacy retention custom resource was replaced during update."
            exit 1
          fi

          stack_rate="$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Parameters[?ParameterKey=='ApiThrottlingRateLimit'].ParameterValue | [0]" \
              --output text
          )"
          stack_burst="$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Parameters[?ParameterKey=='ApiThrottlingBurstLimit'].ParameterValue | [0]" \
              --output text
          )"
          stage_name="\$default"
          stage_rate="$(
            aws apigatewayv2 get-stage \
              --api-id "$HTTP_API_ID" \
              --stage-name "$stage_name" \
              --region "$AWS_REGION" \
              --query DefaultRouteSettings.ThrottlingRateLimit \
              --output text
          )"
          stage_burst="$(
            aws apigatewayv2 get-stage \
              --api-id "$HTTP_API_ID" \
              --stage-name "$stage_name" \
              --region "$AWS_REGION" \
              --query DefaultRouteSettings.ThrottlingBurstLimit \
              --output text
          )"
          if [[ "$stack_rate" != "7.5" || "$stack_burst" != "11" ||
                "$stage_rate" != "7.5" || "$stage_burst" != "11" ]]; then
            echo "::error::The configured API throttle was not preserved by the update."
            exit 1
          fi

          for log_group in $MANAGED_LOG_GROUPS $LEGACY_LOG_GROUPS; do
            retention="$(
              aws logs describe-log-groups \
                --log-group-name-prefix "$log_group" \
                --region "$AWS_REGION" \
                --query "logGroups[?logGroupName=='$log_group'].retentionInDays | [0]" \
                --output text
            )"
            if [[ "$retention" != "14" ]]; then
              echo "::error::$log_group has retention $retention instead of 14 days."
              exit 1
            fi
          done

          inbound_count="$(
            aws logs describe-log-groups \
              --log-group-name-prefix "/hayasend/$STACK_NAME/inbound" \
              --region "$AWS_REGION" \
              --query "length(logGroups[?logGroupName=='/hayasend/$STACK_NAME/inbound'])" \
              --output text
          )"
          if [[ "$inbound_count" != "0" ]]; then
            echo "::error::Inbound-disabled deployment created an inbound log group."
            exit 1
          fi

      - name: Prove alarm-driven canary rollback
        if: ${{ inputs.prove_canary_rollback }}
        shell: bash
        run: |
          set -euo pipefail
          source_file="src/aws/api.ts"
          original_source_sha="$(
            shasum --algorithm 256 "$source_file" | awk '{print $1}'
          )"
          baseline_alias_version="$(
            aws lambda get-alias \
              --function-name "$API_FUNCTION" \
              --name live \
              --region "$AWS_REGION" \
              --query FunctionVersion \
              --output text
          )"
          proof_started_at="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          proof_reason="HayaSend integration rollback proof ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          upgrade_log="$RUNNER_TEMP/hayasend-canary-rollback-update.jsonl"

          reset_proof_state() {
            git show "HEAD:$source_file" > "$source_file"
            aws cloudwatch set-alarm-state \
              --alarm-name "$API_ALIAS_ALARM" \
              --state-value OK \
              --state-reason "$proof_reason completed" \
              --region "$AWS_REGION" >/dev/null 2>&1 || true
          }
          trap reset_proof_state EXIT

          node --input-type=module - "$source_file" "$GITHUB_RUN_ID" <<'NODE'
          import { appendFile } from "node:fs/promises";
          const [, , sourceFile, runId] = process.argv;
          if (!/^[0-9]+$/.test(runId)) {
            throw new Error("The GitHub run ID is invalid.");
          }
          await appendFile(
            sourceFile,
            `\nexport const HAYASEND_CANARY_ROLLBACK_PROOF = ${JSON.stringify(runId)};\n`,
          );
          NODE

          backup_flags=(--disable-backups --disable-restore-testing)
          if [[ "$PROVE_BACKUP_RESTORE" = "true" ]]; then
            backup_flags=(--enable-backups --enable-restore-testing --backup-retention-days 1)
          fi

          set +e
          npm run --silent cli -- upgrade aws \
            --account "$AWS_TEST_ACCOUNT_ID" \
            --stack "$STACK_NAME" \
            --region "$AWS_REGION" \
            --worker-reserved-concurrency 0 \
            --log-retention-days 14 \
            "${backup_flags[@]}" \
            --allow-destructive-changes \
            --tag Purpose=IntegrationTest \
            --tag "GitHubRun=$GITHUB_RUN_ID" \
            --apply \
            > "$upgrade_log" 2>&1 &
          upgrade_pid=$!
          set -e

          application_names="$(
            aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?ResourceType=='AWS::CodeDeploy::Application'].PhysicalResourceId" \
              --output text
          )"
          if [[ -z "$application_names" || "$application_names" = "None" ]]; then
            echo "::error::The stack has no CodeDeploy application."
            exit 1
          fi

          triggering_deployment_id=""
          triggering_application=""
          triggering_deployment_group=""
          for _ in {1..120}; do
            for application_name in $application_names; do
              deployment_group_names="$(
                aws deploy list-deployment-groups \
                  --application-name "$application_name" \
                  --region "$AWS_REGION" \
                  --query deploymentGroups \
                  --output text
              )"
              if [[ -z "$deployment_group_names" ||
                    "$deployment_group_names" = "None" ]]; then
                continue
              fi
              for deployment_group_name in $deployment_group_names; do
                deployment_ids="$(
                  aws deploy list-deployments \
                    --application-name "$application_name" \
                    --deployment-group-name "$deployment_group_name" \
                    --create-time-range "start=$proof_started_at" \
                    --region "$AWS_REGION" \
                    --query deployments \
                    --output text
                )"
                if [[ -z "$deployment_ids" ||
                      "$deployment_ids" = "None" ]]; then
                  continue
                fi
                for deployment_id in $deployment_ids; do
                  creator="$(
                    aws deploy get-deployment \
                      --deployment-id "$deployment_id" \
                      --region "$AWS_REGION" \
                      --query deploymentInfo.creator \
                      --output text
                  )"
                  if [[ "$creator" != "codeDeployRollback" ]]; then
                    triggering_deployment_id="$deployment_id"
                    triggering_application="$application_name"
                    triggering_deployment_group="$deployment_group_name"
                    break 4
                  fi
                done
              done
            done
            if ! kill -0 "$upgrade_pid" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          if [[ -z "$triggering_deployment_id" ]]; then
            set +e
            wait "$upgrade_pid"
            set -e
            echo "::error::The synthetic code change did not start a CodeDeploy deployment."
            sed -n '1,160p' "$upgrade_log"
            exit 1
          fi

          for _ in {1..240}; do
            aws cloudwatch set-alarm-state \
              --alarm-name "$API_ALIAS_ALARM" \
              --state-value ALARM \
              --state-reason "$proof_reason" \
              --region "$AWS_REGION"
            if ! kill -0 "$upgrade_pid" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          set +e
          wait "$upgrade_pid"
          upgrade_exit=$?
          set -e
          if [[ "$upgrade_exit" = "0" ]]; then
            echo "::error::The alarmed canary update unexpectedly succeeded."
            exit 1
          fi

          aws cloudwatch set-alarm-state \
            --alarm-name "$API_ALIAS_ALARM" \
            --state-value OK \
            --state-reason "$proof_reason completed" \
            --region "$AWS_REGION"
          git show "HEAD:$source_file" > "$source_file"

          rollback_deployment_id=""
          rollback_status=""
          for _ in {1..120}; do
            deployment_ids="$(
              aws deploy list-deployments \
                --application-name "$triggering_application" \
                --deployment-group-name "$triggering_deployment_group" \
                --create-time-range "start=$proof_started_at" \
                --region "$AWS_REGION" \
                --query deployments \
                --output text
            )"
            if [[ -z "$deployment_ids" || "$deployment_ids" = "None" ]]; then
              sleep 5
              continue
            fi
            for deployment_id in $deployment_ids; do
              deployment="$(
                aws deploy get-deployment \
                  --deployment-id "$deployment_id" \
                  --region "$AWS_REGION" \
                  --query deploymentInfo \
                  --output json
              )"
              creator="$(jq --raw-output '.creator // ""' <<< "$deployment")"
              triggering_id="$(
                jq --raw-output \
                  '.rollbackInfo.rollbackTriggeringDeploymentId // ""' \
                  <<< "$deployment"
              )"
              if [[ "$creator" = "codeDeployRollback" &&
                    "$triggering_id" = "$triggering_deployment_id" ]]; then
                rollback_deployment_id="$deployment_id"
                rollback_status="$(
                  jq --raw-output '.status // ""' <<< "$deployment"
                )"
                break
              fi
            done
            if [[ "$rollback_status" = "Succeeded" ]]; then
              break
            fi
            sleep 5
          done

          triggering_deployment="$(
            aws deploy get-deployment \
              --deployment-id "$triggering_deployment_id" \
              --region "$AWS_REGION" \
              --query deploymentInfo \
              --output json
          )"
          triggering_status="$(
            jq --raw-output '.status // ""' <<< "$triggering_deployment"
          )"
          alarm_rollback_enabled="$(
            jq --raw-output '
              .autoRollbackConfiguration.enabled == true and
              (.autoRollbackConfiguration.events // [] |
                index("DEPLOYMENT_STOP_ON_ALARM") != null)
            ' <<< "$triggering_deployment"
          )"
          if [[ "$triggering_status" != "Failed" &&
                "$triggering_status" != "Stopped" ]]; then
            echo "::error::The alarmed deployment ended as $triggering_status."
            exit 1
          fi
          if [[ "$alarm_rollback_enabled" != "true" ]]; then
            echo "::error::The failed deployment did not enable alarm rollback."
            exit 1
          fi
          if [[ -z "$rollback_deployment_id" ||
                "$rollback_status" != "Succeeded" ]]; then
            echo "::error::CodeDeploy did not complete the automatic rollback."
            exit 1
          fi

          current_alias_version="$(
            aws lambda get-alias \
              --function-name "$API_FUNCTION" \
              --name live \
              --region "$AWS_REGION" \
              --query FunctionVersion \
              --output text
          )"
          current_source_sha="$(
            shasum --algorithm 256 "$source_file" | awk '{print $1}'
          )"
          stack_status=""
          for _ in {1..120}; do
            stack_status="$(
              aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --query "Stacks[0].StackStatus" \
                --output text
            )"
            case "$stack_status" in
              UPDATE_ROLLBACK_COMPLETE)
                break
                ;;
              *_IN_PROGRESS)
                sleep 5
                ;;
              *)
                break
                ;;
            esac
          done
          if [[ "$current_alias_version" != "$baseline_alias_version" ]]; then
            echo "::error::The live API alias did not return to its baseline version."
            exit 1
          fi
          if [[ "$current_source_sha" != "$original_source_sha" ]]; then
            echo "::error::The workflow checkout was not restored after the proof."
            exit 1
          fi
          if [[ "$stack_status" != "UPDATE_ROLLBACK_COMPLETE" ]]; then
            echo "::error::The stack ended in unexpected state $stack_status."
            exit 1
          fi
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            "$API_BASE_URL/health" >/dev/null

          jq -n \
            --arg triggering_deployment_id "$triggering_deployment_id" \
            --arg triggering_status "$triggering_status" \
            --arg rollback_deployment_id "$rollback_deployment_id" \
            --arg rollback_status "$rollback_status" \
            --arg baseline_alias_version "$baseline_alias_version" \
            --arg restored_alias_version "$current_alias_version" \
            --arg stack_status "$stack_status" \
            '{
              ok: true,
              object: "aws_canary_rollback_proof",
              triggering_deployment_id: $triggering_deployment_id,
              triggering_status: $triggering_status,
              alarm_rollback_enabled: true,
              stack_owned_alarm_forced: true,
              rollback_deployment_id: $rollback_deployment_id,
              rollback_status: $rollback_status,
              baseline_alias_version: $baseline_alias_version,
              restored_alias_version: $restored_alias_version,
              stack_status: $stack_status,
              health: "ok"
            }'

          trap - EXIT

      - name: Exercise deployed API
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_key="$(
            aws secretsmanager get-secret-value \
              --secret-id "$BOOTSTRAP_SECRET_ARN" \
              --query SecretString \
              --output text
          )"
          echo "::add-mask::$bootstrap_key"
          HAYASEND_BASE_URL="$API_BASE_URL" \
          HAYASEND_EXPECTED_API_ID="$HTTP_API_ID" \
          HAYASEND_BOOTSTRAP_KEY="$bootstrap_key" \
          node scripts/aws-integration.mjs \
            | tee "$RUNNER_TEMP/hayasend-aws-evidence.json"

      - name: Prove durable outbox recovery
        shell: bash
        run: |
          set -euo pipefail
          email_id="$(
            node -e \
              'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).recovery_email_id)' \
              "$RUNNER_TEMP/hayasend-aws-evidence.json"
          )"
          if [[ ! "$email_id" =~ ^email_[A-Za-z0-9_-]{16,128}$ ]]; then
            echo "::error::The integration probe did not return a valid email ID."
            exit 1
          fi
          outbox_id="outbox:v1:${email_id}:dispatch-message:0"
          partition_key="OUTBOX#${outbox_id}"
          now_iso="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"
          key="$(
            jq -cn \
              --arg value "$partition_key" \
              '{PK:{S:$value},SK:{S:$value}}'
          )"
          names='{"#entity":"entity","#due":"due_at","#updated":"updated_at","#lease_owner":"lease_owner","#lease_expires":"lease_expires_at","#dispatched":"dispatched_at"}'
          values="$(
            jq -cn \
              --arg now "$now_iso" \
              --arg partition "OUTBOX_DUE" \
              --arg sort "${now_iso}#${outbox_id}" \
              '{":now":{S:$now},":partition":{S:$partition},":sort":{S:$sort}}'
          )"
          aws dynamodb update-item \
            --table-name "$DATA_TABLE" \
            --region "$AWS_REGION" \
            --key "$key" \
            --condition-expression "attribute_exists(PK) AND attribute_not_exists(#entity.#dispatched)" \
            --update-expression "SET #entity.#due = :now, #entity.#updated = :now, GSI1PK = :partition, GSI1SK = :sort REMOVE #entity.#lease_owner, #entity.#lease_expires" \
            --expression-attribute-names "$names" \
            --expression-attribute-values "$values"

          item='{}'
          for attempt in {1..12}; do
            aws lambda invoke \
              --function-name "$DISPATCHER_FUNCTION" \
              --region "$AWS_REGION" \
              --cli-binary-format raw-in-base64-out \
              --payload '{}' \
              "$RUNNER_TEMP/dispatcher-result-${attempt}.json" \
              > "$RUNNER_TEMP/dispatcher-metadata-${attempt}.json"
            node -e \
              'const fs=require("node:fs"); const metadata=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (metadata.FunctionError) throw new Error("Dispatcher invocation failed.");' \
              "$RUNNER_TEMP/dispatcher-metadata-${attempt}.json"
            item="$(
              aws dynamodb get-item \
                --table-name "$DATA_TABLE" \
                --region "$AWS_REGION" \
                --key "$key" \
                --consistent-read \
                --query Item \
                --output json
            )"
            if jq -e '.entity.M.dispatched_at.S' <<< "$item" >/dev/null; then
              break
            fi
            sleep 5
          done
          jq -e \
            '.entity.M.dispatched_at.S and
             (.entity.M.lease_owner == null) and
             (.entity.M.lease_expires_at == null) and
             (.GSI1PK == null) and
             (.GSI1SK == null)' \
            <<< "$item" >/dev/null

      - name: Prove isolated semantic restore
        if: ${{ inputs.prove_backup_restore }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/hayasend-aws-evidence.json"
          email_id="$(jq -er '.backup_probe.email_id' "$evidence")"
          attachment_id="$(jq -er '.backup_probe.attachment_id' "$evidence")"
          attachment_sha256="$(
            jq -er '.backup_probe.attachment_sha256' "$evidence"
          )"
          node scripts/aws-backup-restore-proof.mjs prove \
            --account "$AWS_TEST_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --table "$DATA_TABLE" \
            --bucket "$PAYLOAD_BUCKET" \
            --vault-arn "$BACKUP_VAULT_ARN" \
            --backup-role-arn "$BACKUP_SERVICE_ROLE_ARN" \
            --restore-plan-arn "$RESTORE_TESTING_PLAN_ARN" \
            --restore-plan-name "$RESTORE_TESTING_PLAN_NAME" \
            --email-id "$email_id" \
            --attachment-id "$attachment_id" \
            --attachment-sha256 "$attachment_sha256" \
            --state-file "$BACKUP_PROOF_STATE" \
            | tee "$RUNNER_TEMP/hayasend-backup-restore-evidence.json"

      - name: Clean isolated restore resources
        if: ${{ always() && inputs.prove_backup_restore && steps.aws-credentials.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DATA_TABLE:-}" &&
                -n "${PAYLOAD_BUCKET:-}" &&
                -n "${BACKUP_VAULT_ARN:-}" &&
                -n "${RESTORE_TESTING_PLAN_ARN:-}" &&
                -n "${BACKUP_PROOF_STATE:-}" ]]; then
            node scripts/aws-backup-restore-proof.mjs cleanup \
              --account "$AWS_TEST_ACCOUNT_ID" \
              --region "$AWS_REGION" \
              --table "$DATA_TABLE" \
              --bucket "$PAYLOAD_BUCKET" \
              --vault-arn "$BACKUP_VAULT_ARN" \
              --restore-plan-arn "$RESTORE_TESTING_PLAN_ARN" \
              --restore-plan-name "$RESTORE_TESTING_PLAN_NAME" \
              --state-file "$BACKUP_PROOF_STATE"
          fi

      - name: Show CloudFormation failure events
        if: ${{ failure() && steps.aws-credentials.outcome == 'success' }}
        shell: bash
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatusReason!=null].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason] | [:20]" \
            --output table || true

      - name: Delete ephemeral resources
        if: ${{ always() && !inputs.retain_stack && steps.aws-credentials.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          stack_exists=false
          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            stack_exists=true
          fi

          resource_id() {
            aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?LogicalResourceId=='$1'].PhysicalResourceId | [0]" \
              --output text
          }

          if [[ "$stack_exists" = true ]]; then
            if [[ -z "${PAYLOAD_BUCKET:-}" || "$PAYLOAD_BUCKET" = "None" ]]; then
              PAYLOAD_BUCKET="$(resource_id PayloadBucket)"
            fi
            if [[ -z "${DATA_TABLE:-}" || "$DATA_TABLE" = "None" ]]; then
              DATA_TABLE="$(resource_id DataTable)"
            fi
            if [[ "$PROVE_BACKUP_RESTORE" = "true" &&
                  ( -z "${BACKUP_VAULT_ARN:-}" ||
                    "$BACKUP_VAULT_ARN" = "None" ) ]]; then
              backup_vault_name="$(resource_id BackupVault)"
              if [[ -n "$backup_vault_name" &&
                    "$backup_vault_name" != "None" ]]; then
                BACKUP_VAULT_ARN="arn:aws:backup:${AWS_REGION}:${AWS_TEST_ACCOUNT_ID}:backup-vault:${backup_vault_name}"
              fi
            fi
            if [[ -z "${SCHEDULE_GROUP:-}" || "$SCHEDULE_GROUP" = "None" ]]; then
              SCHEDULE_GROUP="$(resource_id EmailScheduleGroup)"
            fi
            if [[ -z "${LEGACY_LOG_GROUPS:-}" ]]; then
              api_function="$(resource_id ApiFunction)"
              worker_function="$(resource_id WorkerFunction)"
              dispatcher_function="$(resource_id DispatcherFunction)"
              ses_events_function="$(resource_id SesEventsFunction)"
              LEGACY_LOG_GROUPS="/aws/lambda/$api_function /aws/lambda/$worker_function /aws/lambda/$dispatcher_function /aws/lambda/$ses_events_function"
            fi
          fi

          aws sesv2 delete-email-identity \
            --email-identity "it-${GITHUB_RUN_ID}.example.com" \
            --region "$AWS_REGION" >/dev/null 2>&1 || true

          if [[ -n "${SCHEDULE_GROUP:-}" && "$SCHEDULE_GROUP" != "None" ]]; then
            schedule_names="$(
              aws scheduler list-schedules \
                --group-name "$SCHEDULE_GROUP" \
                --region "$AWS_REGION" \
                --query "Schedules[].Name" \
                --output text 2>/dev/null || true
            )"
            for schedule_name in $schedule_names; do
              aws scheduler delete-schedule \
                --group-name "$SCHEDULE_GROUP" \
                --name "$schedule_name" \
                --region "$AWS_REGION"
            done
          fi

          if [[ "$stack_exists" = true ]]; then
            npm run --silent cli -- cleanup aws \
              --account "$AWS_TEST_ACCOUNT_ID" \
              --stack "$STACK_NAME" \
              --region "$AWS_REGION" \
              --apply \
              --confirm-stack "$STACK_NAME" \
              --disable-termination-protection || {
                aws cloudformation update-termination-protection \
                  --no-enable-termination-protection \
                  --stack-name "$STACK_NAME" \
                  --region "$AWS_REGION" >/dev/null 2>&1 || true
                aws cloudformation delete-stack \
                  --stack-name "$STACK_NAME" \
                  --region "$AWS_REGION"
                aws cloudformation wait stack-delete-complete \
                  --stack-name "$STACK_NAME" \
                  --region "$AWS_REGION"
              }
          fi

          if [[ -n "${PAYLOAD_BUCKET:-}" && "$PAYLOAD_BUCKET" != "None" ]] &&
            aws s3api head-bucket --bucket "$PAYLOAD_BUCKET" >/dev/null 2>&1; then
            node scripts/aws-versioned-bucket.mjs purge \
              --account "$AWS_TEST_ACCOUNT_ID" \
              --region "$AWS_REGION" \
              --bucket "$PAYLOAD_BUCKET" \
              --confirm-bucket "$PAYLOAD_BUCKET"
            aws s3api delete-bucket \
              --bucket "$PAYLOAD_BUCKET" \
              --region "$AWS_REGION"
          fi

          if [[ -n "${DATA_TABLE:-}" && "$DATA_TABLE" != "None" ]] &&
            aws dynamodb describe-table \
              --table-name "$DATA_TABLE" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
            aws dynamodb delete-table \
              --table-name "$DATA_TABLE" \
              --region "$AWS_REGION" >/dev/null
            aws dynamodb wait table-not-exists \
              --table-name "$DATA_TABLE" \
              --region "$AWS_REGION"
          fi

          if [[ "$PROVE_BACKUP_RESTORE" = "true" &&
                -n "${BACKUP_VAULT_ARN:-}" &&
                "$BACKUP_VAULT_ARN" != "None" ]]; then
            backup_vault_name="${BACKUP_VAULT_ARN##*:}"
            if ! backup_vault_error="$(
              aws backup describe-backup-vault \
                --backup-vault-name "$backup_vault_name" \
                --region "$AWS_REGION" 2>&1 >/dev/null
            )"; then
              if [[ "$backup_vault_error" = *"ResourceNotFoundException"* ]]; then
                echo "Backup vault $backup_vault_name was not created or was already removed."
              else
                echo "::error::Unable to inspect backup vault $backup_vault_name: $backup_vault_error"
                exit 1
              fi
            else
              for attempt in {1..20}; do
                recovery_points="$(
                  aws backup list-recovery-points-by-backup-vault \
                    --backup-vault-name "$backup_vault_name" \
                    --region "$AWS_REGION" \
                    --query "RecoveryPoints[].RecoveryPointArn" \
                    --output text
                )"
                if [[ -z "$recovery_points" ]]; then
                  break
                fi
                for recovery_point in $recovery_points; do
                  aws backup delete-recovery-point \
                    --backup-vault-name "$backup_vault_name" \
                    --recovery-point-arn "$recovery_point" \
                    --region "$AWS_REGION" || true
                done
                sleep 15
              done
              recovery_points="$(
                aws backup list-recovery-points-by-backup-vault \
                  --backup-vault-name "$backup_vault_name" \
                  --region "$AWS_REGION" \
                  --query "RecoveryPoints[].RecoveryPointArn" \
                  --output text
              )"
              if [[ -n "$recovery_points" ]]; then
                echo "::error::Recovery points remain in $backup_vault_name."
                exit 1
              fi
              aws backup delete-backup-vault \
                --backup-vault-name "$backup_vault_name" \
                --region "$AWS_REGION"
              if aws backup describe-backup-vault \
                --backup-vault-name "$backup_vault_name" \
                --region "$AWS_REGION" >/dev/null 2>&1; then
                echo "::error::Retained backup vault still exists after cleanup."
                exit 1
              fi
            fi
          fi

          artifact_bucket="$(
            aws cloudformation describe-stacks \
              --stack-name aws-sam-cli-managed-default \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='SourceBucket'].OutputValue | [0]" \
              --output text 2>/dev/null || true
          )"
          artifact_prefix="hayasend/$STACK_NAME/"
          if [[ -n "$artifact_bucket" && "$artifact_bucket" != "None" ]]; then
            node scripts/aws-versioned-bucket.mjs purge \
              --account "$AWS_TEST_ACCOUNT_ID" \
              --region "$AWS_REGION" \
              --bucket "$artifact_bucket" \
              --confirm-bucket "$artifact_bucket" \
              --prefix "$artifact_prefix" \
              --confirm-prefix "$artifact_prefix"
          fi

          log_group_prefix="/aws/lambda/${STACK_NAME}-"
          legacy_log_groups="$(
            aws logs describe-log-groups \
              --log-group-name-prefix "$log_group_prefix" \
              --region "$AWS_REGION" \
              --query "logGroups[].logGroupName" \
              --output text 2>/dev/null || true
          )"
          for log_group in $legacy_log_groups; do
            aws logs delete-log-group \
              --log-group-name "$log_group" \
              --region "$AWS_REGION"
          done

          managed_log_groups=""
          for attempt in {1..12}; do
            managed_log_groups="$(
              aws logs describe-log-groups \
                --log-group-name-prefix "/hayasend/$STACK_NAME/" \
                --region "$AWS_REGION" \
                --query "logGroups[].logGroupName" \
                --output text 2>/dev/null || true
            )"
            if [[ -z "$managed_log_groups" ]]; then
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          for log_group in $managed_log_groups; do
            echo "::error::Stack-owned log group remained after stack deletion: $log_group"
            aws logs delete-log-group \
              --log-group-name "$log_group" \
              --region "$AWS_REGION"
          done

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "::error::CloudFormation stack still exists after cleanup."
            exit 1
          fi
          remaining_legacy_log_groups="$(
            aws logs describe-log-groups \
              --log-group-name-prefix "$log_group_prefix" \
              --region "$AWS_REGION" \
              --query "logGroups[].logGroupName" \
              --output text
          )"
          if [[ -n "$remaining_legacy_log_groups" ]]; then
            echo "::error::Legacy Lambda log groups still exist after cleanup."
            exit 1
          fi
          if [[ -n "$managed_log_groups" ]]; then
            exit 1
          fi

      - name: Record retained stack
        if: ${{ always() && inputs.retain_stack && steps.aws-credentials.outcome == 'success' }}
        shell: bash
        run: |
          {
            echo "### AWS integration resources retained"
            echo
            echo "Stack: \`$STACK_NAME\`"
            echo "Region: \`$AWS_REGION\`"
            echo
            echo "Delete it manually as soon as debugging is complete."
          } >> "$GITHUB_STEP_SUMMARY"
