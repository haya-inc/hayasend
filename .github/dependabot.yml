version: 2
updates:
  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    open-pull-requests-limit: 0
    directory: /tests/sdk
    schedule:
      interval: weekly
