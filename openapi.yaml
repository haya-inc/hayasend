openapi: 3.1.0
info:
  title: HayaSend API
  version: 0.1.0
  description: Resend-compatible transactional email API backed by Amazon SES.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8787
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Check service health
      security: []
      operationId: health
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, version]
                properties:
                  ok:
                    type: boolean
                  service:
                    const: hayasend
                  version:
                    type: string
  /emails:
    post:
      summary: Send an email
      operationId: sendEmail
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmail"
      responses:
        "200":
          $ref: "#/components/responses/CreatedId"
        "422":
          $ref: "#/components/responses/Error"
    get:
      summary: List emails
      operationId: listEmails
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Email page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Email"
  /emails/batch:
    post:
      summary: Send a batch of emails
      operationId: sendBatch
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: "#/components/schemas/SendEmail"
      responses:
        "200":
          description: Accepted email identifiers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Id"
  /emails/receiving:
    get:
      summary: List received emails
      description: Requires the emails:read scope. Message bodies are omitted.
      operationId: listReceivedEmails
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Received email page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ReceivedEmailSummary"
  /emails/receiving/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Retrieve a received email
      description: Returns parsed content and a 15-minute URL for the original raw MIME message.
      operationId: getReceivedEmail
      parameters:
        - name: html_format
          in: query
          description: Embed inline attachments as bounded data URIs or preserve cid references.
          schema:
            type: string
            enum: [data_uri, cid]
            default: data_uri
      responses:
        "200":
          description: Received email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedEmail"
        "404":
          $ref: "#/components/responses/Error"
  /emails/receiving/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: List received email attachments
      operationId: listReceivedEmailAttachments
      responses:
        "200":
          description: Attachment metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ReceivedEmailAttachmentDownload"
  /emails/receiving/{id}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Retrieve a received email attachment
      description: Returns metadata and a 15-minute download URL.
      operationId: getReceivedEmailAttachment
      responses:
        "200":
          description: Attachment download target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedEmailAttachmentDownload"
        "404":
          $ref: "#/components/responses/Error"
  /emails/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Retrieve an email
      operationId: getEmail
      responses:
        "200":
          description: Email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Reschedule an email
      operationId: rescheduleEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scheduled_at]
              properties:
                scheduled_at:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/CreatedId"
  /emails/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Cancel an email
      operationId: cancelEmail
      responses:
        "200":
          $ref: "#/components/responses/CreatedId"
  /attachments:
    post:
      summary: Create a direct attachment upload
      description: Returns a 15-minute checksum-bound PUT URL. Reference the uploaded object by attachment_id within 24 hours.
      operationId: createAttachmentUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUploadRequest"
      responses:
        "200":
          description: Direct upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUpload"
        "422":
          $ref: "#/components/responses/Error"
  /attachments/{id}/content:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - name: token
        in: query
        required: true
        schema:
          type: string
    put:
      summary: Upload attachment content in local development mode
      description: The AWS deployment returns a direct S3 URL instead. Clients should treat upload_url as opaque.
      operationId: uploadLocalAttachmentContent
      security: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              contentEncoding: binary
      responses:
        "204":
          description: Content accepted
        "422":
          $ref: "#/components/responses/Error"
  /domains:
    post:
      summary: Add a sending domain
      operationId: createDomain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  format: hostname
      responses:
        "200":
          description: Domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
    get:
      summary: List sending domains
      operationId: listDomains
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Domain page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Domain"
  /domains/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Retrieve a sending domain
      operationId: getDomain
      responses:
        "200":
          description: Domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
    delete:
      summary: Delete a sending domain
      operationId: deleteDomain
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
  /domains/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Refresh domain verification
      operationId: verifyDomain
      responses:
        "200":
          description: Refreshed domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
  /webhooks:
    post:
      summary: Register a webhook
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint, events]
              properties:
                endpoint:
                  type: string
                  format: uri
                events:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Webhook and one-time signing secret
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Webhook"
                  - type: object
                    required: [signing_secret]
                    properties:
                      signing_secret:
                        type: string
    get:
      summary: List webhooks
      operationId: listWebhooks
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Webhook page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Webhook"
  /webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Retrieve a webhook
      operationId: getWebhook
      responses:
        "200":
          description: Webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
    delete:
      summary: Delete a webhook
      operationId: deleteWebhook
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
  /suppressions:
    post:
      summary: Add a suppression
      operationId: createSuppression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                reason:
                  const: manual
                  default: manual
                detail:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Suppression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suppression"
    get:
      summary: List suppressions
      operationId: listSuppressions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Suppression page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Suppression"
  /suppressions/{email}:
    parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
          format: email
    get:
      summary: Retrieve a suppression
      operationId: getSuppression
      responses:
        "200":
          description: Suppression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suppression"
    delete:
      summary: Delete a suppression
      operationId: deleteSuppression
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
  /api-keys:
    post:
      summary: Create a scoped API key
      description: The token is returned once and is never stored in plaintext.
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scopes]
              properties:
                name:
                  type: string
                  maxLength: 100
                scopes:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/ApiScope"
                expires_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: API key and one-time token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiKey"
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
    get:
      summary: List API keys
      operationId: listApiKeys
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: API key page without secret tokens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ApiKey"
  /api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Retrieve an API key
      operationId: getApiKey
      responses:
        "200":
          description: API key metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
    delete:
      summary: Revoke an API key
      operationId: revokeApiKey
      responses:
        "200":
          description: Revoked API key metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiKey"
                  - type: object
                    required: [revoked]
                    properties:
                      revoked:
                        const: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    After:
      name: after
      in: query
      schema:
        type: string
  responses:
    CreatedId:
      description: Resource accepted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Id"
    Deleted:
      description: Resource deleted
      content:
        application/json:
          schema:
            type: object
            required: [object, id, deleted]
            properties:
              object:
                type: string
              id:
                type: string
              deleted:
                const: true
    Error:
      description: API error
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, name, message]
            properties:
              statusCode:
                type: integer
              name:
                type: string
              message:
                type: string
  schemas:
    Id:
      type: object
      required: [id]
      properties:
        id:
          type: string
    SendEmail:
      type: object
      additionalProperties: false
      required: [from, to, subject]
      anyOf:
        - required: [html]
        - required: [text]
      properties:
        from:
          type: string
        to:
          $ref: "#/components/schemas/AddressList"
        subject:
          type: string
        html:
          type: string
        text:
          type: string
        cc:
          $ref: "#/components/schemas/AddressList"
        bcc:
          $ref: "#/components/schemas/AddressList"
        reply_to:
          $ref: "#/components/schemas/AddressList"
        headers:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          maxItems: 49
          items:
            type: object
            additionalProperties: false
            required: [name, value]
            properties:
              name:
                type: string
              value:
                type: string
        attachments:
          type: array
          maxItems: 20
          items:
            oneOf:
              - $ref: "#/components/schemas/InlineAttachment"
              - $ref: "#/components/schemas/UploadedAttachment"
        scheduled_at:
          type: string
    AddressList:
      oneOf:
        - type: string
        - type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
    Email:
      type: object
      required:
        [id, from, to, subject, status, last_event, created_at, updated_at]
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: array
          items:
            type: string
        subject:
          type: string
        html:
          type: string
        text:
          type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        reply_to:
          type: array
          items:
            type: string
        headers:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: object
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/PublicAttachment"
        scheduled_at:
          type: string
        status:
          type: string
        last_event:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        provider_id:
          type: string
        error:
          type: string
    ReceivedEmailSummary:
      type: object
      required:
        - object
        - id
        - from
        - to
        - received_for
        - bcc
        - cc
        - reply_to
        - subject
        - message_id
        - attachments
        - created_at
      properties:
        object:
          const: email
        id:
          type: string
          pattern: ^recv_[a-f0-9]{32}$
        from:
          type: string
        to:
          type: array
          items:
            type: string
        received_for:
          type: array
          description: SMTP envelope recipients accepted by the ingress.
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        reply_to:
          type: array
          items:
            type: string
        subject:
          type: string
        message_id:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ReceivedEmailAttachment"
        created_at:
          type: string
          format: date-time
        content_truncated:
          type: boolean
          description: True when structured body fields were bounded; use raw.download_url for complete MIME.
    ReceivedEmail:
      allOf:
        - $ref: "#/components/schemas/ReceivedEmailSummary"
        - type: object
          required: [html, html_format, text, headers, raw]
          properties:
            html:
              type: [string, "null"]
            html_format:
              type: string
              enum: [data_uri, cid]
              description: The inline-image representation actually returned.
            text:
              type: [string, "null"]
            headers:
              type: object
              additionalProperties:
                type: string
            raw:
              $ref: "#/components/schemas/DownloadTarget"
    ReceivedEmailAttachment:
      type: object
      required:
        - id
        - filename
        - size
        - content_type
        - content_disposition
        - content_id
      properties:
        id:
          type: string
          pattern: ^att_[a-f0-9]{32}$
        filename:
          type: string
        size:
          type: integer
          minimum: 0
        content_type:
          type: string
        content_disposition:
          type: [string, "null"]
          enum: [inline, attachment, null]
        content_id:
          type: [string, "null"]
    DownloadTarget:
      type: object
      required: [download_url, expires_at]
      properties:
        download_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    ReceivedEmailAttachmentDownload:
      allOf:
        - $ref: "#/components/schemas/ReceivedEmailAttachment"
        - $ref: "#/components/schemas/DownloadTarget"
    InlineAttachment:
      type: object
      additionalProperties: false
      required: [filename, content]
      properties:
        filename:
          type: string
          maxLength: 255
        content:
          type: string
          contentEncoding: base64
        content_type:
          type: string
        content_id:
          type: string
        content_disposition:
          enum: [inline, attachment]
    UploadedAttachment:
      type: object
      additionalProperties: false
      required: [attachment_id]
      properties:
        attachment_id:
          type: string
          pattern: ^att_[a-f0-9]{32}$
        filename:
          type: string
          maxLength: 255
        content_type:
          type: string
        content_id:
          type: string
        content_disposition:
          enum: [inline, attachment]
    PublicAttachment:
      type: object
      required: [filename]
      properties:
        attachment_id:
          type: string
        filename:
          type: string
        content_type:
          type: string
        content_id:
          type: string
        content_disposition:
          enum: [inline, attachment]
    AttachmentUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, content_type, size_bytes, checksum_sha256]
      properties:
        filename:
          type: string
          maxLength: 255
        content_type:
          type: string
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 1
          maximum: 26214400
        checksum_sha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
    AttachmentUpload:
      type: object
      required:
        - id
        - filename
        - content_type
        - size_bytes
        - checksum_sha256
        - upload_url
        - upload_method
        - upload_headers
        - expires_at
        - attachment_expires_at
      properties:
        id:
          type: string
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
        checksum_sha256:
          type: string
        upload_url:
          type: string
          format: uri
        upload_method:
          const: PUT
        upload_headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
        attachment_expires_at:
          type: string
          format: date-time
    Domain:
      type: object
      required: [id, name, status, region, records, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          enum: [not_started, pending, verified, failed]
        region:
          type: string
        records:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookEvent:
      enum:
        - email.sent
        - email.delivered
        - email.delivery_delayed
        - email.opened
        - email.clicked
        - email.bounced
        - email.complained
        - email.failed
        - email.scheduled
        - email.suppressed
        - email.received
    Webhook:
      type: object
      required: [id, endpoint, events, status, created_at]
      properties:
        id:
          type: string
        endpoint:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvent"
        status:
          enum: [enabled, disabled]
        created_at:
          type: string
          format: date-time
    ApiScope:
      enum:
        - emails:send
        - emails:read
        - domains:read
        - domains:write
        - webhooks:read
        - webhooks:write
        - suppressions:read
        - suppressions:write
        - api_keys:read
        - api_keys:write
    ApiKey:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiScope"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    Suppression:
      type: object
      required: [id, email, reason, created_at, updated_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        reason:
          enum: [bounce, complaint, manual]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
